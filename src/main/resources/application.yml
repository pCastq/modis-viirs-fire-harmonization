spring:
  application:
    name: firecal
  datasource:
    # Stesse variabili del docker-compose.yml; i valori predefiniti sono SOLO per lo sviluppo locale.
    url: jdbc:postgresql://${FIRECAL_DB_HOST:localhost}:${FIRECAL_DB_PORT:5433}/${FIRECAL_DB_NAME:firecal}
    username: ${FIRECAL_DB_USER:firecal}
    password: ${FIRECAL_DB_PASSWORD:firecal}
  flyway:
    # Le migrazioni stanno in src/main/resources/db/migration (V1__..., V2__...) e partono all'avvio.
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
