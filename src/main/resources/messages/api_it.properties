# --- Avvertenze mostrate insieme ai numeri
note.methodProvisional=Metodo di armonizzazione PROVVISORIO ({0}): usa fattori globali, uguali per ogni regione, mese e giorno/notte. L’incertezza dichiarata è una stima prudente, non una misura. Il metodo definitivo è in studio.
note.methodCountryMonthK=Metodo di armonizzazione {0}: le celle-giorno MODIS sono convertite in equivalente VIIRS con un moltiplicatore per paese, mese dell’anno e filtro; VIIRS (S-NPP, NOAA-20, NOAA-21) è usato così com’è. Per aree più piccole di un paese il moltiplicatore è locale (blocchi di 2 gradi) e tirato verso quello del paese. L’incertezza dichiarata è l’errore misurato su anni che il metodo non aveva visto: il valore sotto cui è rimasto l’errore 8 volte su 10. Prima del 2012 si aggiunge circa il 10% di incertezza strutturale (Terra e Aqua non concordano).
note.methodCountryQuarterK=Metodo di armonizzazione {0}: le celle-giorno MODIS sono convertite in equivalente VIIRS con un moltiplicatore (k) per paese, trimestre dell’anno e giorno/notte, calibrato sugli anni in cui MODIS e VIIRS hanno osservato insieme; VIIRS (S-NPP, NOAA-20, NOAA-21) è usato così com’è. Per aree più piccole di un paese il moltiplicatore è locale (blocchi di 2 gradi) e tirato verso quello del paese. L’incertezza dichiarata è l’errore misurato su anni che il metodo non aveva visto: il valore sotto cui è rimasto l’errore 8 volte su 10. Prima del 2012 si aggiunge circa il 10% di incertezza strutturale (Terra e Aqua non concordano). I moltiplicatori davvero usati sono nel pannello di armonizzazione.
note.methodRaw=Nessuna armonizzazione ({0}): somma dei conteggi di tutti i satelliti. Mostra il salto artificiale del 2012 (arrivo di VIIRS).
note.resolutionPyramid=Poligono grande: calcolato sulla piramide a 0,1 gradi; il bordo dell’area è approssimato fino a ~5 km.
note.resolutionCountry=Paese: totali precalcolati, con il paese assegnato da FIRMS a ogni punto.
note.vegetationOnly=Solo incendi di vegetazione. Le altre sorgenti (industriali, vulcani, offshore) sono escluse: usare sourceType=ALL per includerle.
note.incompleteMonths=Alcuni mesi sono incompleti (giorni mancanti dei satelliti): non sono confrontabili e sono esclusi dalla mediana storica.
note.cellDayArea=Le celle-giorno sono quadrati da 0,01 gradi attivi in un giorno: la loro area va da ~1,2 km2 all’equatore a ~0,7 km2 in Terra del Fuoco.
note.detailRawPerSatellite=Conteggi grezzi per satellite (celle-giorno attive). Il valore armonizzato è del mese intero, non del singolo giorno.
note.detailGaps=Un giorno senza dati di un satellite (barretta chiara sotto l’asse) o con dati parziali (barretta piena) non è un giorno senza fuochi: significa che quel satellite non ha osservato.
note.metaDataCoverage=Dati standard (SP) fino al 2025-12-31 per il Sud America e l’Italia; i dati NRT e il 2026 non sono ancora caricati.
note.metaSatellites=NOAA-21 non è ancora caricato. S-NPP ha smesso di fornire dati il 2026-11-02 (dichiarato da FIRMS).
note.metaAreas=Aree disponibili oggi: i paesi del perimetro (Sud America e Italia) e poligoni disegnati. Province e regioni richiedono confini amministrativi non ancora caricati.
note.harmonizationHowToRead=k è il numero di celle-giorno VIIRS viste per ogni cella-giorno MODIS (Terra+Aqua) nello stesso paese, trimestre e giorno/notte, misurato sugli anni di calibrazione indicati. Dove un trimestre ha troppo pochi dati il moltiplicatore viene da tutti i paesi insieme (regione) o dall’intera calibrazione (globale).
note.harmonizationNoCalibration=Non è ancora stata calcolata nessuna calibrazione: i conteggi MODIS sono mostrati così come sono, con la massima incertezza dichiarata. Lancia il comando di calibrazione (vedi README).
