# --- Notes shown with the numbers
note.methodProvisional=PROVISIONAL harmonization method ({0}): it uses global factors, the same for every region, month and day/night. The declared uncertainty is a cautious estimate, not a measurement. The final method is still being studied.
note.methodCountryMonthK=Harmonization method {0}: MODIS cell-days are converted to VIIRS-equivalent with a multiplier per country, month of the year and filter; VIIRS (S-NPP, NOAA-20, NOAA-21) is used as is. For areas smaller than a country the multiplier is local (2-degree blocks) and pulled toward the country. The declared uncertainty is the error measured on years the method had not seen: the value below which the error fell in 8 cases out of 10. Before 2012 about 10% of structural uncertainty is added (Terra and Aqua disagree).
note.methodCountryQuarterK=Harmonization method {0}: MODIS cell-days are converted to VIIRS-equivalent with a multiplier (k) per country, quarter of the year and day/night, calibrated on the years when MODIS and VIIRS both observed; VIIRS (S-NPP, NOAA-20, NOAA-21) is used as is. For areas smaller than a country the multiplier is local (2-degree blocks) and pulled toward the country. For a whole country the declared uncertainty is the error measured on years the method had not seen: the value below which the error fell in 8 cases out of 10; for drawn areas it is a cautious estimate that was not validated separately. Before 2012 about 10% of structural uncertainty is added (Terra and Aqua disagree). The multipliers used for a country are listed in the harmonization panel.
note.methodRaw=No harmonization ({0}): sum of the counts of all satellites. It shows the artificial jump of 2012 (arrival of VIIRS).
note.resolutionPyramid=Large polygon: computed on the 0.1 degree pyramid; the area border is approximate, up to ~5 km.
note.resolutionCountry=Country: precomputed totals, with the country assigned by FIRMS to each point.
note.vegetationOnly=Vegetation fires only. Other sources (industrial, volcanoes, offshore) are excluded: choose All under "Source type" to include them.
note.incompleteMonths=Some months are incomplete (days missing for some satellites): they are not comparable and are excluded from the historical median.
note.cellDayArea=Cell-days are 0.01 degree squares active in a day: their area ranges from ~1.2 km2 at the equator to ~0.7 km2 in Tierra del Fuego.
note.detailRawPerSatellite=Raw counts per satellite (active cell-days). The harmonized value refers to the whole month, not to a single day.
note.detailGaps=A day without data from a satellite (light bar under the axis) or with partial data (solid bar) is not a day without fires: it means that satellite did not observe.
note.metaDataCoverage=Standard (SP) data up to 2025-12-31 for South America and Italy; NRT data and 2026 are not loaded yet.
note.metaSatellites=NOAA-21 is not loaded yet. S-NPP stopped providing data on 2026-11-02 (declared by FIRMS).
note.metaAreas=Areas available today: the countries in scope (South America and Italy) and drawn polygons. Provinces and regions need administrative boundaries that are not loaded yet.
note.harmonizationHowToRead=k is the number of VIIRS cell-days seen for each MODIS (Terra+Aqua) cell-day in the same country, quarter and day/night, measured on the calibration years shown. Where a quarter has too little data the multiplier comes from all countries together (region) or from the whole calibration (global).
note.harmonizationNoCalibration=No calibration has been computed yet: MODIS counts are shown as they are, with the highest declared uncertainty. Run the calibration command (see README).
area.detailNotLoaded=Day-by-day detail, hotspot points and downloads of {0} are not included in this dataset (the full data is too large to ship). Available for: {1}. Calendars, anomalies and harmonization work for every country.
area.outsideLoadedDetail=This {0} is outside the areas with detail in this dataset. Draw it inside one of: {1}. Calendars, anomalies and harmonization work for every country.
